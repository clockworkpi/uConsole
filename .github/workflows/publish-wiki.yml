name: Publish wiki
on:
  push:
    branches: [master]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    # Forks do not inherit the upstream wiki repository. Publish only after
    # these files reach the canonical repository's default branch.
    if: github.repository == 'clockworkpi/uConsole'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
